<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verity Shooter</title>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
} }
</script>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="lowhp"></div>
  <div id="vignette"></div>
  <div id="crosshair"><i></i><i></i><i></i><i></i><b></b></div>
  <div id="hitmarker"><i></i><i></i><i></i><i></i></div>
  <div class="panel" id="wave"><div class="n">WAVE 1</div><div class="s">FALSITY LEFT: 0</div></div>
  <div class="panel" id="score"><div class="n">0</div><div class="c"></div></div>
  <div class="panel" id="health"><div class="lbl">INTEGRITY</div><div class="bar"><div class="fill"></div></div></div>
  <div class="panel" id="ammo"><div class="n">30<small> / ∞</small></div><div class="s">VERITY-A</div></div>
  <div id="banner"></div>
  <div id="reloadtxt">RELOADING</div>
</div>

<div id="overlay">
  <h1>VERITY SHOOTER</h1>
  <h2>PURGE THE FALSITY</h2>
  <div class="go" id="go">LOADING…</div>
  <div class="keys">
    <b>W A S D</b><span>Move</span>
    <b>SHIFT</b><span>Sprint (while moving forward)</span>
    <b>SPACE</b><span>Jump</span>
    <b>MOUSE / HOLD LMB</b><span>Look / Fire (full-auto)</span>
    <b>RMB</b><span>Aim down sights</span>
    <b>R</b><span>Reload</span>
    <b>ESC</b><span>Pause</span>
  </div>
  <div class="msg" id="msg"></div>
</div>

<script type="module" src="js/main.js"
  onerror="document.getElementById('go').textContent='COULD NOT START';var m=document.getElementById('msg');m.className='msg err';m.textContent='Game scripts failed to load. Serve this folder over http (run run.bat or run.sh - do not open index.html directly) and make sure you are online: three.js and cannon-es are loaded from the jsDelivr CDN.';"></script>
</body>
</html>
